name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: pytest (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[screenshot,test]"

      - name: Run tests
        run: pytest tests/ -q

  # tests/test_cross_repo_protocol.py uses pytest.importorskip to silently
  # skip when the sister repo clawtouch-hid isn't installed. The default
  # `test` job above only installs clawtouch-mcp, so those 22 byte-equality
  # tests were quietly skipped on every CI run — defeating the whole point
  # of having a cross-repo regression net for protocol drift. This job
  # explicitly installs both packages and asserts the cross-repo suite is
  # not skipped.
  cross-repo:
    name: cross-repo protocol byte-equality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clawtouch-mcp
        uses: actions/checkout@v4

      - name: Checkout clawtouch-hid (sister repo)
        uses: actions/checkout@v4
        with:
          repository: tinqiao-oss/clawtouch-hid
          path: _sister_hid
        # No continue-on-error: if the sister repo is unreachable (renamed,
        # not yet published, private) the cross-repo byte-equality net is
        # dead, so this job MUST go red rather than silently skip. The trio
        # publishes atomically: publish clawtouch-hid before clawtouch-mcp.

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install both packages
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[screenshot,test]"
          if [ -d _sister_hid ]; then
            pip install -e ./_sister_hid
            echo "sister_installed=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::clawtouch-hid sister repo not checked out — cross-repo byte-equality suite cannot run"
            exit 1
          fi

      - name: Run cross-repo suite
        run: pytest tests/test_cross_repo_protocol.py -v --no-header

      - name: Assert cross-repo suite actually ran (not all skipped)
        run: |
          # If clawtouch-hid is installed but suite is fully skipped, fail loudly.
          out=$(pytest tests/test_cross_repo_protocol.py -q 2>&1 | tail -3)
          echo "$out"
          echo "$out" | grep -qE "passed|failed" || (echo "::error::cross-repo suite fully skipped despite sister repo installed"; exit 1)

  # The dsh plugin under adapters/ is a Node package, so pytest never sees
  # it. Its unit tests cover the coordinate maths and the model-reply
  # parsing — the two places where a bug produces a plausible-looking
  # coordinate instead of an error, which is the failure mode this whole
  # feature is built to avoid.
  dsh-plugin:
    name: dsh plugin (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests (no host, no hardware, no API key)
        working-directory: adapters/dsh/plugin
        run: node test.js
      - name: Manifest declares the bundle patch
        working-directory: adapters/dsh/plugin
        # A dsh plugin missing `dsh.bundle.patch` installs cleanly, mounts
        # nothing, and reports no error — the single most common way to
        # ship a plugin that does nothing at all.
        run: |
          node -e "
            const fs = require('node:fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            const patch = pkg.dsh?.bundle?.patch
            if (!patch) { console.error('package.json declares no dsh.bundle.patch'); process.exit(1) }
            if (!fs.existsSync(patch)) { console.error('bundle patch missing: ' + patch); process.exit(1) }
            for (const f of pkg.files ?? []) {
              if (!fs.existsSync(f.replace(/\/$/, ''))) { console.error('files[] lists a missing path: ' + f); process.exit(1) }
            }
            console.log('manifest ok: ' + patch)
          "

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check clawtouch_mcp tests
